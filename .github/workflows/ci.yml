name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint productization surface
        run: >-
          python -m ruff check
          src/conformalguard/__init__.py
          src/conformalguard/__main__.py
          src/conformalguard/guard.py
          src/conformalguard/cli.py
          src/conformalguard/html_report.py
          src/conformalguard/suite.py
          tests/test_guard_facade.py
          tests/test_cli.py
          tests/test_html_report.py
          tests/test_suite.py
          examples/quickstart.py

      - name: Run full test suite
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
