name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint productization surface
        run: >-
          python -m ruff check
          src/conformalguard/__init__.py
          src/conformalguard/__main__.py
          src/conformalguard/guard.py
          src/conformalguard/cli.py
          src/conformalguard/html_report.py
          src/conformalguard/suite.py
          tests/test_guard_facade.py
          tests/test_cli.py
          tests/test_html_report.py
          tests/test_suite.py
          examples/quickstart.py
      - name: Run full test suite
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
